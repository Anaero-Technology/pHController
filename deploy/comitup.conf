# Comitup configuration  ->  install to /etc/comitup.conf
#
# Comitup gives the headless Pi Wi-Fi onboarding: on first boot (or when it
# can't reach a known network) it raises a Wi-Fi hotspot + captive portal so a
# phone/laptop can pick the Wi-Fi network and enter its password. Once joined,
# the Pi is online and stays connected on later boots.

# Hotspot name shown during setup. <nnnn> is replaced with a unique per-device
# suffix from the MAC address.
ap_name: pHController-<nnnn>

# Optional: WPA2 password for the *setup* hotspot (leave commented for open).
# ap_password: changeme123

# Start this systemd service when the Pi is connected to a Wi-Fi network, and
# stop it while in hotspot/config mode. This is what makes the web app come up
# automatically "once connected to the internet".
web_service: phtest-api.service

# Use mDNS so the Pi is reachable at a friendly hostname (e.g. pHController.local).
enable_appliance_mode: 1
